# BEHAVIOR 2026 (R1Pro, OmniGibson) data config for G0.5 post-training.
# Expects the task-filtered LeRobot v3 subset produced by tools/make_b1k_subset.py
# (derived per-part columns action.*/observation.state.*, RGB videos only).
_target_: g05.data.mixture_lerobot_dataset.MixtureLerobotDataset
use_weight_normalization: true
use_weight_for_sampling: false
action_size: 32
past_action_size: 0
obs_size: 1
obs_stride_second: 0.0
val_set_proportion: 0.005   # last ~5 episodes held out for val loss (split is by episode order)
is_training_set: true
processors:
  behavior_r1pro:
    shape_meta: &behavior_shape_meta
      action:
      - key: left_arm
        lerobot_key: action.left_arm
        start_index: 0
        raw_shape: 7
        shape: 7
        time_offset: 0
      - key: left_gripper
        lerobot_key: action.left_gripper
        start_index: 0
        raw_shape: 1
        shape: 1
        time_offset: 0
      - key: right_arm
        lerobot_key: action.right_arm
        start_index: 0
        raw_shape: 7
        shape: 7
        time_offset: 0
      - key: right_gripper
        lerobot_key: action.right_gripper
        start_index: 0
        raw_shape: 1
        shape: 1
        time_offset: 0
      - key: lower_body            # [torso(4) joint pos, base vel (vx, vy, wz)]
        lerobot_key: action.lower_body
        start_index: 0
        raw_shape: 7
        shape: 7
        time_offset: 0
      state:
      - key: left_arm
        lerobot_key: observation.state.left_arm
        start_index: 0
        raw_shape: 7
        shape: 7
        time_offset: 0
      - key: left_gripper
        lerobot_key: observation.state.left_gripper
        start_index: 0
        raw_shape: 1
        shape: 1
        time_offset: 0
      - key: right_arm
        lerobot_key: observation.state.right_arm
        start_index: 0
        raw_shape: 7
        shape: 7
        time_offset: 0
      - key: right_gripper
        lerobot_key: observation.state.right_gripper
        start_index: 0
        raw_shape: 1
        shape: 1
        time_offset: 0
      - key: lower_body            # [trunk qpos(4), base qvel(3)]
        lerobot_key: observation.state.lower_body
        start_index: 0
        raw_shape: 7
        shape: 7
        time_offset: 0
      images:
      - key: head_rgb
        camera_type: exterior
        lerobot_key: observation.rgb.zed_link_camera_0
        start_index: 0
        raw_shape:
        - 3
        - 720
        - 720
        shape:
        - 3
        - 224
        - 224
        time_offset: 0
      - key: left_wrist_rgb
        camera_type: wrist_left
        lerobot_key: observation.rgb.left_realsense_link_camera_0
        start_index: 0
        raw_shape:
        - 3
        - 480
        - 480
        shape:
        - 3
        - 224
        - 224
        time_offset: 0
      - key: right_wrist_rgb
        camera_type: wrist_right
        lerobot_key: observation.rgb.right_realsense_link_camera_0
        start_index: 0
        raw_shape:
        - 3
        - 480
        - 480
        shape:
        - 3
        - 224
        - 224
        time_offset: 0
    action_state_transforms:
    # arms: absolute joint targets -> delta w.r.t. current joint state (same as r1pro configs)
    - _target_: g05.data_processor.transforms.relative_action.RelativeJointTransform
      keys:
      - left_arm
      - right_arm
    # lower_body: only the first 4 dims (torso joints) are made relative; base velocity stays absolute
    - _target_: g05.data_processor.transforms.relative_action_partial.RelativeJointTransformPartial
      keys_dims:
        lower_body: 4
    train_transforms:
      head_rgb: ${oc.load:configs/data/_transforms.yaml,train_head}
      left_wrist_rgb: ${oc.load:configs/data/_transforms.yaml,train_wrist}
      right_wrist_rgb: ${oc.load:configs/data/_transforms.yaml,train_wrist}
    val_transforms:
      head_rgb: ${oc.load:configs/data/_transforms.yaml,val}
      left_wrist_rgb: ${oc.load:configs/data/_transforms.yaml,val}
      right_wrist_rgb: ${oc.load:configs/data/_transforms.yaml,val}
    norm_default_mode: z-score-tail
    norm_exception_mode:
      action:
        left_gripper: q01/q99
        right_gripper: q01/q99
      state:
        left_gripper: q01/q99
        right_gripper: q01/q99
    action_filter:
      _target_: g05.data_processor.transforms.action_filter.BaseActionFilter
    # replaced wholesale by the task-level model.processor.action_state_merger (GroupedPaddingMerger)
    action_state_merger:
      _target_: g05.data_processor.transforms.action_state_merger.GroupedPaddingMerger
      merge: true
      max_action_shape_meta: ${oc.load:configs/data/parts_meta/r1pro.yaml,parts_meta}
      max_state_shape_meta: ${oc.load:configs/data/parts_meta/r1pro.yaml,parts_meta}
      merge_spec: ${oc.load:configs/data/parts_meta/r1pro.yaml,merge_spec}
    num_obs_steps: 1
    use_stepwise_action_norm: true
    drop_high_level_prob: 1.0
    use_zh_instruction: false
embodiment_datasets:
  behavior_r1pro:
    type: g05.data.base_lerobot_datasetV3.BaseLerobotDatasetV3
    embodiment_type: behavior_r1pro
    lerobot_ds_version: '3.0'
    shape_meta: *behavior_shape_meta
    stats_downsample_rate: 10
    dataset_groups:
    - weight: 1.0
      dataset_dirs:
      - ${oc.env:B1K_SUBSET_DIR,data/b1k_5task_lerobot}
