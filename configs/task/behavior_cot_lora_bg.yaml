# @package _global_
# behavior_cot_lora.yaml with the belief-graph CoT targets switched ON.
# Identical except the candidate list: BBox + 2D trace + the output-only belief-graph
# targets of behavior_cot_v2.yaml (same builders, same weights). There is still no
# BeliefGraph input slot, so inference needs no belief runtime.
#
#     TASK_CONFIG=behavior_cot_lora_bg bash scripts/train_g05_cot.sh <EXP> ...
#
# Needs bg_{delta,belief,observe,effect}_index in the dataset (merge_b1k_cot_labels.py
# --bg-targets). Without them these candidates are simply never applicable.
# Hydra replaces lists wholesale, so the BBox / trace candidates are repeated here.
defaults:
- behavior_cot_lora
- _self_

model:
  processor:
    samples_builder:
      candidates:
      - _target_: g05.data_processor.processor.samples_builder.BBoxCoTBuilder
        weight: 1.0
      - _target_: g05.data_processor.processor.samples_builder.Trace2DCoTBuilder
        weight: 1.0
      - _target_: g05.data_processor.processor.samples_builder.DeltaCoTBuilder
        weight: 0.5
      - _target_: g05.data_processor.processor.samples_builder.UpdateCoTBuilder
        weight: 0.5
      - _target_: g05.data_processor.processor.samples_builder.ObserveCoTBuilder
        weight: 0.5
      - _target_: g05.data_processor.processor.samples_builder.EffectCoTBuilder
        weight: 0.5
      - _target_: g05.data_processor.processor.samples_builder.FullBeliefCoTBuilder
        weight: 0.2
      - _target_: g05.data_processor.processor.samples_builder.ObserveUpdateCoTBuilder
        weight: 0.4
