# @package _global_

# specify here default configuration
# order of defaults determines the order in which configs override each other
defaults:
  - _self_
  - data:
  - model:
  - tokenizer: null
  - task:

seed: 7

use_fused_optimizer: False # fused=True for AdamW: single fused CUDA kernel for optimizer step
resume_ckpt: null
# Set to an output .npy to run the correlated-noise covariance estimation instead of training
# (scripts/finetune.py, models/g05/helpers/action_covariance.py).
estimate_action_cov: null
estimate_action_cov_samples: 20000
exp_name: "${oc.env:EXP_NAME, ${now:%Y-%m-%d_%H-%M-%S}}"
output_dir: ${hydra:runtime.output_dir}

# checkpointing
checkpointing_steps: 2000

# eval
eval_steps: 100
eval_num_batches: 1   # validation batches averaged per periodic eval (each rank draws its own)
best_metric: eval/action/rollout/ar_action_acc   # eval metric that selects checkpoints/best.pt
best_metric_mode: max   # max: higher is better (accuracy); min: lower is better (e.g. eval/action/rollout/fm_action_l1)
# Skill-balanced start-frame sampling (src/g05/data/skill_sampler.py) instead of uniform shuffling of frames.
# Needs meta/episodes raw_episode_id and <annotations_root>/annotations/task-XXXX/episode_*.json (outside the
# dataset dir: the LeRobot loader reads <dataset>/annotations as subtask annotations).
skill_sampler:
  enabled: false
  B: null                 # samples per local epoch
  s_max: null             # stride cap (global epoch = G <= s_max local epochs)
  alpha: 0.5              # skill temperature: w_s ~ frames_s^alpha
  annotations_root: null  # required, e.g. the challenge demos root
  start_margin: 0         # forbid starts in the last N frames of a segment (e.g. action_horizon - 1)
  min_skill_frames: 0     # drop skills with fewer total frames
  gap_to_next: true       # unannotated frames between two skills join the next skill's segment
  steps_per_epoch: null   # dataloader epoch length in steps; default ceil(B / global batch)

# Fixed full-coverage validation for checkpoint selection (scripts/utils/tiling_eval.py): the chunks starting
# every `stride` frames of every val episode, scored per skill; e.g. best_metric=eval/tiling/skill_balanced_hybrid_l1 best_metric_mode=min
eval_tiling:
  enabled: false
  every: 2000             # steps; a multiple of eval_steps
  stride: 32              # = action horizon: chunks tile each val episode exactly once
  hybrid_ar_parts: [left_control, right_control]   # model parts from the AR decode (= serving ACTION_HYBRID_AR_PARTS=left_arm,right_arm; lower_body from AR froze the base in rollouts)
  annotations_root: null  # default: skill_sampler.annotations_root
  gap_to_next: true       # unannotated gaps between skills count as the next skill
  min_cell_chunks: 3      # (skill, task) cells with fewer chunks are left out of the skill-balanced mean

# logger configuration - supports swanlab, wandb, or none
logger:
  type: "wandb" # Options: "swanlab", "wandb", null
  log_steps: 10
  task: ${hydra:runtime.choices.task}
  project: "${oc.env:WANDB_PROJECT,g05}" # Will be auto-set from task name
  experiment_name: ${split:${logger.task},-1}_${exp_name} # Will be auto-set from task name

  # Common fields (interpretation depends on type):
  # - For swanlab: mode can be "cloud", "local", "disabled"
  # - For wandb: mode can be "online", "offline", "disabled"
  mode: "online"

  # - For swanlab: workspace is the SwanLab workspace name
  # - For wandb: workspace is the WandB entity/team name (optional)
  workspace: "${oc.env:WANDB_ENTITY,Galaxea-AI}"

  # Output directory for logs (only used for wandb, auto-set to ${output_dir}/wandb or ${output_dir}/swanlab)
  dir: null

# eval
batch_size_val: 16
eval_episodes_num: 1
ckpt_path: null
env: R1ProBlocksStackEasy
target_controller_type: bimanual_relaxed_ik

hydra:
  verbose: false # Show full traceback for instantiate errors
  run:
    # Use exp_name when provided; otherwise use a timestamp.
    dir: "${oc.env:G05_OUTPUT_DIR}/${hydra:runtime.choices.task}/${exp_name}"
  job_logging:
    handlers:
      file:
        filename: ${hydra.runtime.output_dir}/train.log

tags: null

# Tokenizer bridge: task configs override root `tokenizer:` key;
# model code accesses via `cfg.model.tokenizer`.
model:
  tokenizer: ${tokenizer}
