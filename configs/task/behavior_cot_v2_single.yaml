# @package _global_
# Ablation plan A of behavior_cot_v2.yaml: identical in every respect EXCEPT the candidate
# list — single-field CoT targets only (one CoT field per sample).
# Per-candidate weights are copied from behavior_cot_v2.yaml (which mixes A + B + C); weights are
# renormalised over the applicable candidates, so dropping some raises the others' share.
#
#     TASK_CONFIG=behavior_cot_v2_single bash scripts/train_g05_cot.sh <EXP> ...
#
# Hydra replaces lists wholesale, so the candidates are repeated here verbatim.
defaults:
- behavior_cot_v2
- _self_

model:
  processor:
    samples_builder:
      candidates:
      - _target_: g05.data_processor.processor.samples_builder.AtomicTaskBaseSamplesBuilder
        weight: 1.0
      - _target_: g05.data_processor.processor.samples_builder.BBoxSubtaskCoTBuilder
        weight: 1.0
      - _target_: g05.data_processor.processor.samples_builder.SubtaskCoTBuilder
        weight: 1.0
      - _target_: g05.data_processor.processor.samples_builder.BBoxCoTBuilder
        weight: 1.0
      - _target_: g05.data_processor.processor.samples_builder.Trace2DCoTBuilder
        weight: 1.0
      - _target_: g05.data_processor.processor.samples_builder.DeltaCoTBuilder
        weight: 0.5
      - _target_: g05.data_processor.processor.samples_builder.UpdateCoTBuilder
        weight: 0.5
      - _target_: g05.data_processor.processor.samples_builder.ObserveCoTBuilder
        weight: 0.5
      - _target_: g05.data_processor.processor.samples_builder.EffectCoTBuilder
        weight: 0.5
